services:
  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://company:company@postgres:5432/company_service?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      EVENT_PRODUCER: log
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
      POSTGRES_DB: company_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://company:company@postgres:5432/company_service?sslmode=disable", "up"]

volumes:
  postgres-data:
